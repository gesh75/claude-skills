name: lint
on: [push, pull_request]

# Least privilege: the linter only needs to read the checked-out tree.
permissions:
  contents: read

jobs:
  skill-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.x"
      # Runs the vendored linter (.github/bin/skill_lint.py) — committed and
      # reviewed in-repo, not fetched at run time, to avoid supply-chain risk.
      # Update it with: cp ~/path/to/claude-skill-lint/skill_lint.py .github/bin/
      - name: Lint skills
        run: python3 .github/bin/skill_lint.py . --quiet
