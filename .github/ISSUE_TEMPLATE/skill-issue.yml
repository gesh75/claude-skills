name: 🐛 Skill issue
description: Report a problem with an existing skill (stale info, dead ref, bad trigger, bloat…)
title: "[fix] <skill>: <short summary>"
labels: ["skill-fix"]
body:
  - type: input
    id: skill
    attributes:
      label: Which skill
      description: Name of the affected skill.
      placeholder: claude-api
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: Problem type
      options:
        - Stale technical reference (model ID, CLI flag, API, package)
        - Dead reference (missing reference/ file or broken cross-link)
        - Broken frontmatter (won't register / bad YAML)
        - Bloated body (should use progressive disclosure)
        - Weak description / mis-triggering
        - Duplicate or overlap with another skill
        - Inaccurate or incorrect guidance
        - Other
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: What's wrong, and where (file path / line if known).
    validations:
      required: true
  - type: textarea
    id: fix
    attributes:
      label: Proposed fix
      description: Optional — what the correct content / change should be.
    validations:
      required: false
